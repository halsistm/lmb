
<style>
.ot-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 0;
  gap: 20px;
  min-height: 560px;
}
.ot-label {
  font-size: 11px;
  letter-spacing: 0.35em;
  color: var(--color-text-tertiary);
  font-weight: 500;
}
.ot-outer {
  position: relative;
  cursor: pointer;
  transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}
.ot-blobwrap {
  position: absolute;
  top: 0; left: 0;
  overflow: hidden;
}
#glCvs { display: block; }
#glassCvs {
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
}
.ot-sizer { display: block; }
.ot-hint {
  font-size: 12px;
  color: var(--color-text-tertiary);
  letter-spacing: 0.15em;
}
.ot-controls {
  display: flex;
  gap: 12px;
  align-items: center;
}
.ot-btn {
  font-size: 12px;
  padding: 6px 16px;
  border-radius: var(--border-radius-md);
  border: 0.5px solid var(--color-border-secondary);
  background: var(--color-background-secondary);
  color: var(--color-text-secondary);
  cursor: pointer;
}
.ot-btn:hover { background: var(--color-background-primary); }
</style>

<div class="ot-wrap">
  <p class="ot-label">OIL TIMER</p>

  <div id="otOuter" class="ot-outer">
    <svg width="0" height="0" style="position:absolute;overflow:hidden">
      <defs>
        <clipPath id="bottleClip" clipPathUnits="userSpaceOnUse">
          <path id="bottlePath"/>
        </clipPath>
      </defs>
    </svg>
    <div id="blobWrap" class="ot-blobwrap" style="clip-path:url(#bottleClip)">
      <canvas id="glCvs"></canvas>
    </div>
    <canvas id="glassCvs"></canvas>
    <div class="ot-sizer" id="otSizer"></div>
  </div>

  <div class="ot-controls">
    <button class="ot-btn" onclick="doFlip()">↕ 反転</button>
    <button class="ot-btn" onclick="doReset()">↺ リセット</button>
  </div>
  <p class="ot-hint">クリックでも反転できます</p>
</div>

<script>
(function(){
const W=170, H=470, CX=W/2;
const MAX_P = 80; // shader constant — must match #define in FS

// ── Shape ──────────────────────────────────────────────────────────────────
const SHAPE=[
  [0.00,52],[0.05,63],[0.30,66],
  [0.43,26],[0.50,20],[0.57,26],
  [0.70,66],[0.95,63],[1.00,52]
];
function ss(x){return x*x*(3-2*x);}
function hw(y){
  const t=Math.max(0,Math.min(1,y/H));
  for(let i=0;i<SHAPE.length-1;i++){
    if(t>=SHAPE[i][0]&&t<=SHAPE[i+1][0]){
      const f=(t-SHAPE[i][0])/(SHAPE[i+1][0]-SHAPE[i][0]);
      return SHAPE[i][1]+(SHAPE[i+1][1]-SHAPE[i][1])*ss(f);
    }
  }
  return SHAPE[SHAPE.length-1][1];
}
function buildClip(){
  const n=90,pts=[];
  for(let i=0;i<=n;i++){const y=i/n*H;pts.push((CX-hw(y)).toFixed(1)+','+y.toFixed(1));}
  for(let i=n;i>=0;i--){const y=i/n*H;pts.push((CX+hw(y)).toFixed(1)+','+y.toFixed(1));}
  return'M '+pts.join(' L ')+' Z';
}

// ── Physics ─────────────────────────────────────────────────────────────────
const PLATE_TOP=57, PLATE_BOT=413, GAP_R=12;
let P=[],gs=1,lt=0;

function mkP(grp,y,col){
  const h=Math.max(2,hw(y)-16);
  return{
    x:CX+(Math.random()*2-1)*h,
    y:y+(Math.random()-0.5)*10,
    vx:(Math.random()-0.5)*20,
    vy:(Math.random()-0.5)*20,
    r:4+Math.random()*3,
    col,grp
  };
}
function init(){
  P=[];
  const topH=Math.max(18,PLATE_TOP-30);
  const botH=Math.max(18,H-PLATE_BOT-30);
  for(let i=0;i<38;i++) P.push(mkP('A',26+Math.random()*topH,'#ff1a9d'));
  for(let i=0;i<38;i++) P.push(mkP('B',(H-26)-Math.random()*botH,'#00ccff'));
}
function forces(dt){
  const n=P.length;
  for(let i=0;i<n;i++){
    for(let j=i+1;j<n;j++){
      const a=P[i],b=P[j];
      const dx=b.x-a.x,dy=b.y-a.y;
      const d2=dx*dx+dy*dy;
      const md=a.r+b.r;
      if(d2>md*md*7) continue;
      const d=Math.sqrt(d2)||0.01;
      const nx=dx/d,ny=dy/d;
      let f=0;
      if(d<md*0.95){
        f=750*(1-d/(md*0.95));
      } else if(a.grp!==b.grp&&d<md*2){
        f=280*(1-d/(md*2));
      }
      const imp=f*dt;
      a.vx-=nx*imp;a.vy-=ny*imp;
      b.vx+=nx*imp;b.vy+=ny*imp;
    }
  }
}
function step(dt){
  forces(dt);
  for(const p of P){
    const g=(p.grp==='A'?270:-155)*gs;
    p.vy+=g*dt;
    p.vx*=0.93;p.vy*=0.93;
    const spd=Math.hypot(p.vx,p.vy);
    if(spd>210){p.vx*=210/spd;p.vy*=210/spd;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    const lim=hw(p.y)-p.r-3;
    const marg=p.r+4;
    if(p.y<marg){p.y=marg;p.vy=Math.abs(p.vy)*0.4;}
    if(p.y>H-marg){p.y=H-marg;p.vy=-Math.abs(p.vy)*0.4;}
    if(lim>0){
      if(p.x<CX-lim){p.x=CX-lim;p.vx=Math.abs(p.vx)*0.4;}
      if(p.x>CX+lim){p.x=CX+lim;p.vx=-Math.abs(p.vx)*0.4;}
    } else { p.x=CX; }

    // Gap scatter: after crossing plate, kick sideways → droplets
    const GSZ=28;
    [[PLATE_TOP,1],[PLATE_BOT,-1]].forEach(([py,dir])=>{
      const crossed=dir===1?p.y>py:p.y<py;
      if(crossed&&dir*p.vy>0){
        const dist=Math.abs(p.y-py);
        if(dist<GSZ){
          const t=1-dist/GSZ;
          p.vx+=(Math.random()-0.5)*t*28*dt*60;
        }
      }
    });

    // Funnel toward gap
    const FZONE=38;
    [[PLATE_TOP,true],[PLATE_BOT,false]].forEach(([py,openDown])=>{
      const sign=openDown?1:-1;
      if(Math.abs(p.x-CX)>2){
        if(sign*p.vy>0&&p.y*sign<py*sign&&p.y*sign>(py-FZONE)*sign){
          const t=1-Math.abs(p.y-py)/FZONE;
          p.vx+=(CX-p.x)*3.5*t*dt;
        }
        if(sign*p.vy<0&&p.y*sign>py*sign&&p.y*sign<(py+FZONE)*sign){
          const t=1-Math.abs(p.y-py)/FZONE;
          p.vx+=(CX-p.x)*3.5*t*dt;
        }
      }
    });

    // Plate barrier
    const barrier=(plateY)=>{
      if(Math.abs(p.x-CX)>GAP_R){
        if(p.y<plateY&&p.y+p.r>plateY&&p.vy>0){
          p.y=plateY-p.r;p.vy=-Math.abs(p.vy)*0.28;p.vx*=0.65;
        } else if(p.y>plateY&&p.y-p.r<plateY&&p.vy<0){
          p.y=plateY+p.r;p.vy=Math.abs(p.vy)*0.28;p.vx*=0.65;
        }
      }
    };
    barrier(PLATE_TOP);
    barrier(PLATE_BOT);
  }
}

// ── WebGL Setup ──────────────────────────────────────────────────────────────
const glCvs = document.getElementById('glCvs');
const gl = glCvs.getContext('webgl', {antialias:false, alpha:false});

const VS = `
attribute vec2 a_pos;
void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }
`;

// Fragment shader: metaball field + analytic gradient → Phong lighting
// Particle data packed in a texture: RGBA uint8
//   R = x / W * 255
//   G = y / H * 255
//   B = r / 32 * 255
//   A = grp (0=A, 255=B)
const FS = `
precision highp float;
#define MAX_P 80
uniform vec2  u_res;
uniform sampler2D u_ptex; // MAX_P x 1 texture, particle data
uniform int   u_count;

// Reconstruct metaball field and analytic gradient in one pass
void main(){
  vec2 uv = vec2(gl_FragCoord.x, u_res.y - gl_FragCoord.y);
  float fA=0.0, fB=0.0;
  vec2  gA=vec2(0.0), gB=vec2(0.0);

  for(int i=0;i<MAX_P;i++){
    if(i>=u_count) break;
    // Sample particle texture
    vec4 enc = texture2D(u_ptex, vec2((float(i)+0.5)/float(MAX_P), 0.5));
    vec2 pos = enc.xy * u_res;          // unpack position
    float r  = enc.z * 32.0;           // unpack radius
    float grp= enc.w;                  // 0=A, 1=B

    vec2 dv  = uv - pos;
    float d2 = max(dot(dv,dv), 1.0);
    float c  = r*r / d2;               // field contribution
    vec2 gc  = -2.0*r*r*dv/(d2*d2);   // gradient contribution

    float isB = step(0.5, grp);
    fA += c  * (1.0-isB);  gA += gc * (1.0-isB);
    fB += c  * isB;        gB += gc * isB;
  }

  float total = fA + fB;
  float THRESH = 1.05;
  if(total < THRESH){ gl_FragColor=vec4(1.0,1.0,1.0,1.0); return; }

  // --- color blend ---
  float blend  = fB / (total + 0.0001);
  vec3 cA = vec3(1.00, 0.08, 0.58);
  vec3 cB = vec3(0.00, 0.72, 1.00);
  vec3 baseCol = mix(cA, cB, blend);

  // --- surface normal from field gradient ---
  vec2 grad = gA + gB;
  // Gradient points inward; negate for outward normal, z gives surface curvature illusion
  vec3 N = normalize(vec3(-grad * 0.012, 1.0));

  // --- lighting ---
  vec3 L = normalize(vec3(-0.45, -0.9, 1.8));  // key light (upper-left-front)
  vec3 L2= normalize(vec3( 0.6,  0.4, 1.2));  // fill light (lower-right)
  vec3 V = vec3(0.0, 0.0, 1.0);
  vec3 H = normalize(L + V);

  float diff  = max(dot(N, L),  0.0) * 0.70
              + max(dot(N, L2), 0.0) * 0.18;
  float spec  = pow(max(dot(N, H), 0.0), 48.0) * 0.65;

  // Ambient: slightly darker toward edges (field just above threshold → edge)
  float amb   = 0.28 + 0.22 * smoothstep(THRESH, THRESH+0.8, total);

  vec3 col = baseCol * (amb + diff) + vec3(spec);

  // Thin rim darkening
  float rim = 1.0 - smoothstep(THRESH, THRESH+0.35, total);
  col = mix(col, col*0.45, rim*0.6);

  gl_FragColor = vec4(clamp(col,0.0,1.0), 1.0);
}
`;

function compile(src, type){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(VS, gl.VERTEX_SHADER));
gl.attachShader(prog, compile(FS, gl.FRAGMENT_SHADER));
gl.linkProgram(prog);
gl.useProgram(prog);

// Fullscreen quad
const qbuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, qbuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

// Uniforms
const uRes   = gl.getUniformLocation(prog, 'u_res');
const uCount = gl.getUniformLocation(prog, 'u_count');
const uPtex  = gl.getUniformLocation(prog, 'u_ptex');
gl.uniform2f(uRes, W, H);
gl.uniform1i(uPtex, 0);

// Particle texture: MAX_P x 1, RGBA uint8
const ptex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, ptex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
const ptexData = new Uint8Array(MAX_P * 4);

function drawBlobs(){
  // Pack particles into texture
  const n = P.length;
  for(let i=0;i<MAX_P;i++){
    const base = i*4;
    if(i<n){
      ptexData[base]   = Math.round(Math.max(0,Math.min(255, P[i].x/W*255)));
      ptexData[base+1] = Math.round(Math.max(0,Math.min(255, P[i].y/H*255)));
      ptexData[base+2] = Math.round(Math.max(0,Math.min(255, P[i].r/32*255)));
      ptexData[base+3] = P[i].grp==='A' ? 0 : 255;
    } else {
      ptexData[base+2] = 0; // r=0 → no contribution
    }
  }
  gl.bindTexture(gl.TEXTURE_2D, ptex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, MAX_P, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, ptexData);
  gl.uniform1i(uCount, n);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// ── Glass overlay (Canvas 2D, unchanged) ────────────────────────────────────
const gCvs=document.getElementById('glassCvs');
const gCtx=gCvs.getContext('2d');

function drawGlass(){
  gCtx.clearRect(0,0,W,H);
  const n=80;
  gCtx.beginPath();
  gCtx.moveTo(CX-hw(0),0);
  for(let i=1;i<=n;i++) gCtx.lineTo(CX-hw(i/n*H),i/n*H);
  for(let i=n;i>=0;i--) gCtx.lineTo(CX+hw(i/n*H),i/n*H);
  gCtx.closePath();
  gCtx.strokeStyle='rgba(160,190,220,0.45)';
  gCtx.lineWidth=1.5;
  gCtx.stroke();

  gCtx.beginPath();
  gCtx.moveTo(CX-hw(0)+5,2);
  for(let i=1;i<=n;i++){const y=i/n*H;gCtx.lineTo(CX-hw(y)+5,y);}
  gCtx.strokeStyle='rgba(220,240,255,0.18)';
  gCtx.lineWidth=3;
  gCtx.stroke();

  const rr=(x,y,w,h,tl,tr,br,bl)=>{
    gCtx.beginPath();
    gCtx.moveTo(x+tl,y);
    gCtx.lineTo(x+w-tr,y);gCtx.arcTo(x+w,y,x+w,y+tr,tr);
    gCtx.lineTo(x+w,y+h-br);gCtx.arcTo(x+w,y+h,x+w-br,y+h,br);
    gCtx.lineTo(x+bl,y+h);gCtx.arcTo(x,y+h,x,y+h-bl,bl);
    gCtx.lineTo(x,y+tl);gCtx.arcTo(x,y,x+tl,y,tl);
    gCtx.closePath();
  };
  const tw=hw(0)*2,bw=hw(H)*2;
  gCtx.strokeStyle='rgba(160,200,240,0.55)';
  gCtx.lineWidth=1.5;
  gCtx.fillStyle='rgba(200,225,255,0.08)';
  rr(CX-hw(0),0,tw,11,4,4,0,0);gCtx.fill();gCtx.stroke();
  rr(CX-hw(H),H-11,bw,11,0,0,4,4);gCtx.fill();gCtx.stroke();

  const drawPlate=(plateY,openDown)=>{
    const wL=CX-hw(plateY)+3,wR=CX+hw(plateY)-3;
    const tilt=openDown?-11:11;
    gCtx.save();
    gCtx.strokeStyle='rgba(140,185,225,0.72)';
    gCtx.lineWidth=2.8;
    gCtx.lineCap='round';
    gCtx.shadowColor='rgba(160,210,255,0.35)';
    gCtx.shadowBlur=4;
    gCtx.beginPath();
    gCtx.moveTo(wL,plateY+tilt);
    gCtx.lineTo(CX-GAP_R,plateY);
    gCtx.stroke();
    gCtx.beginPath();
    gCtx.moveTo(CX+GAP_R,plateY);
    gCtx.lineTo(wR,plateY+tilt);
    gCtx.stroke();
    gCtx.fillStyle='rgba(180,220,255,0.45)';
    gCtx.beginPath();
    gCtx.arc(CX,plateY,2.5,0,Math.PI*2);
    gCtx.fill();
    gCtx.restore();
  };
  drawPlate(PLATE_TOP,true);
  drawPlate(PLATE_BOT,false);
}

// ── Main loop ────────────────────────────────────────────────────────────────
function loop(now){
  const dt=Math.min((now-(lt||now))/1000,0.033);
  lt=now;
  step(dt);
  drawBlobs();
  drawGlass();
  requestAnimationFrame(loop);
}

function setup(){
  glCvs.width=W; glCvs.height=H;
  gCvs.width=W;  gCvs.height=H;
  gl.viewport(0,0,W,H);
  document.getElementById('otSizer').style.cssText=`width:${W}px;height:${H}px;`;
  document.getElementById('blobWrap').style.cssText+=`;width:${W}px;height:${H}px;`;
  document.getElementById('bottlePath').setAttribute('d',buildClip());
  init();
  requestAnimationFrame(loop);
}

let flipping=false,rotDeg=0;
window.doFlip=function(){
  if(flipping)return;
  flipping=true;
  gs*=-1;
  rotDeg=rotDeg===0?180:0;
  document.getElementById('otOuter').style.transform=`rotate(${rotDeg}deg)`;
  setTimeout(()=>{flipping=false;},900);
};
window.doReset=function(){
  gs=1;rotDeg=0;
  document.getElementById('otOuter').style.transform='rotate(0deg)';
  init();
};
document.getElementById('otOuter').addEventListener('click',doFlip);

setup();
})();
</script>
